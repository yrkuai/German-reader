<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>German Reader</title>
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a19" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="German Reader">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script>
    // 在畫面出現前先套用手動選的淺色／深色，避免閃一下（完整邏輯在 js/theme.js）
    try {
      var t = JSON.parse(localStorage.getItem('gr:settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a id="bar-back" class="bar-back" href="#/" aria-label="返回" hidden>←</a>
    <h1 id="bar-title" class="bar-title">German Reader</h1>
    <div id="bar-actions" class="bar-actions"></div>
    <a id="bar-settings" class="bar-back" href="#/settings" aria-label="設定" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/>
        <circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
      </svg>
    </a>
  </header>
  <main id="view" class="view"></main>
  <noscript><p class="view">這個網站需要啟用 JavaScript。</p></noscript>
</body>
</html>
